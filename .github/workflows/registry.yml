name: registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mcp-registry-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Sync server.json version with tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
            mv server.json.tmp server.json
          fi
          echo "publishing version: $(jq -r .version server.json)"
      - name: Wait for PyPI release to be visible
        run: |
          VERSION=$(jq -r .version server.json)
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/agent-as-model/${VERSION}/json" > /dev/null; then
              echo "agent-as-model ${VERSION} is live on PyPI"
              exit 0
            fi
            echo "waiting for ${VERSION} on PyPI (attempt ${i}/30)..."
            sleep 20
          done
          echo "agent-as-model ${VERSION} never appeared on PyPI" >&2
          exit 1
      - name: Download mcp-publisher
        run: |
          TAG=$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | jq -r .tag_name)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/${TAG}/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
