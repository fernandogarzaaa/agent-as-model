[project]
name = "agent-as-model"
version = "0.1.2"
description = "A true MCP server where the agent is the model and the API key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Garza" }]
dependencies = ["mcp>=2,<3", "jsonschema>=4"]

[project.scripts]
agent-as-model = "agent_as_model.server:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/agent-as-model"
Repository = "https://github.com/fernandogarzaaa/agent-as-model"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_as_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
